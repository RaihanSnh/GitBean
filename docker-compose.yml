name: gitbean
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gitbean}:${POSTGRES_PASSWORD:-gitbean_local}@db:5432/${POSTGRES_DB:-gitbean}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-gitbean_local_change_me_before_deployment_please}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=128m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/recipes').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gitbean}
      POSTGRES_USER: ${POSTGRES_USER:-gitbean}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitbean_local}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --save, "60", "1"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", ping]
      interval: 5s
      timeout: 3s
      retries: 10
  adminer:
    image: adminer:4
    restart: unless-stopped
    profiles: [tools]
    ports: ["${ADMINER_PORT:-8080}:8080"]
    environment: { ADMINER_DEFAULT_SERVER: db }
    depends_on:
      db: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
